name: Check DimmOFF Pine upstream

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for upstream commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=$(tr -d '[:space:]' < vendor/DIMMOFF-PINE-UPSTREAM)
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid DimmOFF Pine revision'; exit 1; }
          latest=$(gh api 'repos/DimmOFF/egui-charts/commits/TradingVision-pinescript-impl' --jq .sha)
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,body --jq '.[] | select(.title == "DimmOFF Pine upstream update available" and ((.body // "") | contains("<!-- tradecraft-dimmoff-pine-upstream-check -->"))) | .number' | head -n 1)
          if [[ "$base" == "$latest" ]]; then
            echo "DimmOFF Pine upstream is current: $base"
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment 'The tracked DimmOFF Pine revision is now current.'
            fi
            exit 0
          fi
          comparison=$(gh api "repos/DimmOFF/egui-charts/compare/$base...$latest")
          status=$(jq -r .status <<< "$comparison")
          ahead=$(jq -r .ahead_by <<< "$comparison")
          behind=$(jq -r .behind_by <<< "$comparison")
          compare_url="https://github.com/DimmOFF/egui-charts/compare/$base...$latest"
          title='DimmOFF Pine upstream update available'
          body=$(printf '<!-- tradecraft-dimmoff-pine-upstream-check -->\nTradeCraft tracks `%s`; DimmOFF Pine branch is at `%s`.\n\nComparison: %s\n\nStatus: %s; upstream commits ahead: %s; commits behind: %s.\n\nReview Pine and chart changes for useful features, fixes, compatibility and licensing. Preserve TradeCraft modifications and validate the personal Windows, community Windows and macOS builds before updating `vendor/DIMMOFF-PINE-UPSTREAM`. This check does not update code automatically.' "$base" "$latest" "$compare_url" "$status" "$ahead" "$behind")
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
